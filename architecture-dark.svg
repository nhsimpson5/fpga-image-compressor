<svg viewBox="0 0 1660 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">FPGA image compressor — Haar encode pipeline (dark)</title>
  <desc id="desc">A .pgm image is streamed through haar_2d_encoder, which runs a row pass then a column pass and quantizes the result into four subbands. The LH/HH detail subbands and LL/HL approximation subbands still need to be wired into the RLE encoder, shown with dashed amber arrows, before producing the .rle output.</desc>

  <rect x="0" y="0" width="1660" height="560" fill="#0d1117"/>

  <defs>
    <marker id="arrowD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <marker id="arrowPendingD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d29922"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="830" y="38" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#e6edf3">FPGA Image Compressor — Haar Encode Pipeline</text>
  <text x="830" y="62" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#8b949e">Stage 3: single-level 2D Haar transform → quantization → RLE (hookup in progress)</text>

  <!-- Encoder grouping box -->
  <rect x="240" y="158" width="690" height="324" rx="14" fill="none" stroke="#6e7681" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="260" y="182" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#8b949e">haar_2d_encoder</text>

  <!-- IMG -->
  <g>
    <rect x="40" y="288" width="170" height="64" rx="12" fill="#10261c" stroke="#2ea043" stroke-width="2"/>
    <text x="125" y="314" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#7ee2a8">.pgm image</text>
    <text x="125" y="336" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#56d364">read via TEXTIO</text>
  </g>

  <!-- ROW -->
  <g>
    <rect x="260" y="288" width="170" height="64" rx="12" fill="#10261c" stroke="#2ea043" stroke-width="2"/>
    <text x="345" y="314" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#7ee2a8">Row pass</text>
    <text x="345" y="336" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#56d364">haar_row_transform</text>
  </g>

  <!-- COL -->
  <g>
    <rect x="480" y="288" width="170" height="64" rx="12" fill="#10261c" stroke="#2ea043" stroke-width="2"/>
    <text x="565" y="314" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#7ee2a8">Column pass</text>
    <text x="565" y="336" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#56d364">haar_column_transform</text>
  </g>

  <!-- QA -->
  <g>
    <rect x="740" y="178" width="170" height="64" rx="12" fill="#10261c" stroke="#2ea043" stroke-width="2"/>
    <text x="825" y="204" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#7ee2a8">Quantizer</text>
    <text x="825" y="226" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#56d364">haar_quantizer</text>
  </g>

  <!-- QB -->
  <g>
    <rect x="740" y="398" width="170" height="64" rx="12" fill="#10261c" stroke="#2ea043" stroke-width="2"/>
    <text x="825" y="424" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#7ee2a8">Quantizer</text>
    <text x="825" y="446" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#56d364">haar_quantizer</text>
  </g>

  <!-- DETAIL -->
  <g>
    <rect x="970" y="178" width="200" height="64" rx="12" fill="#10261c" stroke="#2ea043" stroke-width="2"/>
    <text x="1070" y="204" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#7ee2a8">LH / HH</text>
    <text x="1070" y="226" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#56d364">detail subbands</text>
  </g>

  <!-- APPROX -->
  <g>
    <rect x="970" y="398" width="200" height="64" rx="12" fill="#10261c" stroke="#2ea043" stroke-width="2"/>
    <text x="1070" y="424" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#7ee2a8">LL / HL</text>
    <text x="1070" y="446" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#56d364">approx subbands</text>
  </g>

  <!-- RLE -->
  <g>
    <rect x="1250" y="288" width="170" height="64" rx="12" fill="#10261c" stroke="#2ea043" stroke-width="2"/>
    <text x="1335" y="314" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#7ee2a8">RLE encode</text>
    <text x="1335" y="336" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#56d364">rle_encoder</text>
  </g>

  <!-- OUT -->
  <g>
    <rect x="1470" y="288" width="140" height="64" rx="12" fill="#10261c" stroke="#2ea043" stroke-width="2"/>
    <text x="1540" y="320" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#7ee2a8">.rle output</text>
  </g>

  <!-- Arrows: solid, verified data path -->
  <line x1="210" y1="320" x2="256" y2="320" stroke="#8b949e" stroke-width="2.5" marker-end="url(#arrowD)"/>
  <line x1="430" y1="320" x2="476" y2="320" stroke="#8b949e" stroke-width="2.5" marker-end="url(#arrowD)"/>

  <!-- fork after column pass -->
  <line x1="650" y1="320" x2="690" y2="320" stroke="#8b949e" stroke-width="2.5"/>
  <circle cx="690" cy="320" r="4" fill="#8b949e"/>
  <polyline points="690,320 690,210 736,210" fill="none" stroke="#8b949e" stroke-width="2.5" marker-end="url(#arrowD)"/>
  <polyline points="690,320 690,430 736,430" fill="none" stroke="#8b949e" stroke-width="2.5" marker-end="url(#arrowD)"/>

  <line x1="910" y1="210" x2="966" y2="210" stroke="#8b949e" stroke-width="2.5" marker-end="url(#arrowD)"/>
  <line x1="910" y1="430" x2="966" y2="430" stroke="#8b949e" stroke-width="2.5" marker-end="url(#arrowD)"/>

  <!-- Arrows: dashed, hookup in progress -->
  <polyline points="1170,210 1210,210 1210,320 1246,320" fill="none" stroke="#d29922" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrowPendingD)"/>
  <polyline points="1170,430 1210,430 1210,320 1246,320" fill="none" stroke="#d29922" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrowPendingD)"/>

  <line x1="1420" y1="320" x2="1466" y2="320" stroke="#8b949e" stroke-width="2.5" marker-end="url(#arrowD)"/>

  <!-- Legend -->
  <line x1="480" y1="512" x2="520" y2="512" stroke="#8b949e" stroke-width="2.5" marker-end="url(#arrowD)"/>
  <text x="530" y="517" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#c9d1d9">Verified in simulation</text>

  <line x1="800" y1="512" x2="840" y2="512" stroke="#d29922" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrowPendingD)"/>
  <text x="850" y="517" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#e3b341">RLE hookup in progress</text>
</svg>
